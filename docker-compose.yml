services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: combiphar-app:latest
    container_name: combiphar-app
    # No `command:` override on purpose. The image entrypoint starts supervisord,
    # which owns nginx, PHP-FPM and the Inertia SSR daemon; supervisor restarts a
    # crashed SSR daemon the way the old inline shell loop did, but its state is
    # visible to `supervisorctl status` instead of silently degrading every page
    # to client-render. Concurrency is now PHP-FPM's pool, not the 10-worker cap
    # of the built-in server.
    ports:
      - "80:80"
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - combiphar

  mysql:
    image: mysql:8.0
    container_name: combiphar-mysql
    environment:
      # Values come from the repo .env (compose reads it for ${...} substitution)
      # so real credentials never live in this tracked file. NOTE: the mysql
      # image only applies these on FIRST init of an empty data volume — to
      # rotate a password on an existing volume, ALTER USER inside mysql AND
      # update .env to match.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-combiphar}
      MYSQL_USER: ${DB_USERNAME:-combiphar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Loopback-only: host-local tools (mysql CLI, dumps) keep working, but the
      # port is never internet-reachable (published Docker ports bypass ufw-style
      # host firewalls). The app connects over the compose network (DB_HOST=mysql).
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - combiphar

volumes:
  vendor:
  node_modules:
  mysql-data:

networks:
  combiphar:
