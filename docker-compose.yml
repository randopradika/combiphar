services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: combiphar-app:latest
    container_name: combiphar-app
    # Mirrors the image CMD, declared here as well on purpose: a change to this
    # file makes `docker compose up -d` recreate the container even when the
    # image is not rebuilt, so the SSR daemon is guaranteed to come back. The
    # daemon runs in a supervision loop and is decoupled from storage:link with
    # `;` — a storage:link failure must not stop SSR from starting, and a
    # crashed daemon must restart itself, or the site silently serves the
    # client-rendered shell until someone notices.
    command: >
      sh -c "php artisan storage:link --force || true;
      : > storage/logs/ssr.log;
      (while true; do php artisan inertia:start-ssr >> storage/logs/ssr.log 2>&1;
      echo '[ssr] daemon exited, restarting in 5s' >> storage/logs/ssr.log;
      sleep 5; done &) ;
      php artisan serve --host=0.0.0.0 --port=80"
    environment:
      # Multi-worker built-in server so Livewire/Filament file uploads
      # don't deadlock (single-threaded `artisan serve` hangs uploads).
      PHP_CLI_SERVER_WORKERS: "10"
    ports:
      - "80:80"
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - combiphar

  mysql:
    image: mysql:8.0
    container_name: combiphar-mysql
    environment:
      # Values come from the repo .env (compose reads it for ${...} substitution)
      # so real credentials never live in this tracked file. NOTE: the mysql
      # image only applies these on FIRST init of an empty data volume — to
      # rotate a password on an existing volume, ALTER USER inside mysql AND
      # update .env to match.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-combiphar}
      MYSQL_USER: ${DB_USERNAME:-combiphar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Loopback-only: host-local tools (mysql CLI, dumps) keep working, but the
      # port is never internet-reachable (published Docker ports bypass ufw-style
      # host firewalls). The app connects over the compose network (DB_HOST=mysql).
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - combiphar

volumes:
  vendor:
  node_modules:
  mysql-data:

networks:
  combiphar:
