# Public site + CMS, served by nginx in front of PHP-FPM.
#
# Replaces `php artisan serve` + server.php. The built-in server executed ANY
# .php under public/ — and public/storage symlinks to the CMS upload tree — so
# a single writable script there was remote code execution. Here exactly one
# PHP file is reachable: the front controller.
#
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Matches the 50MB Livewire temporary-upload cap (config/livewire.php) plus
    # multipart overhead. Larger requests are refused by nginx before PHP starts.
    client_max_body_size 52m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/otf font/ttf;

    # Laravel's SecurityHeaders middleware sets these on app responses, but
    # static files never reach PHP — so nginx has to set them itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Vite output is content-hashed, so it can never go stale.
    # `expires` would emit a SECOND Cache-Control header alongside add_header,
    # so set it once here instead.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CMS uploads. Untrusted bytes: never executed, never rendered as a document.
    # A week, not a day: Filament generates a fresh random filename on every
    # upload, so a replaced image never reuses its path — long caching is safe.
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;

        # `^~` above tells nginx to skip ALL regex locations once this prefix
        # matches, so the `location ~ \.php$` deny further down never applies to
        # upload paths — verified: it served the source of a planted .php. It
        # still could not EXECUTE (only `= /index.php` reaches PHP-FPM), but a
        # nested deny is needed so uploads are never disclosed either.
        location ~* \.(php[0-9]?|phtml|phps|phar|pht|inc|hh)$ {
            return 404;
        }

        # An SVG that is NAVIGATED TO renders as a document and runs any script
        # inside it, in this origin — the stored-XSS vector, since any CMS user
        # can upload one. As an <img> source it never executes, and
        # Content-Disposition does not affect <img>, so forcing a download here
        # closes the hole with no visual change anywhere on the site.
        # (add_header does not inherit into a nested location — hence the repeats.)
        location ~* \.svg$ {
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        try_files $uri =404;
    }

    # Health check for the load balancer only — it reveals app liveness and
    # should not be public. The allow list covers RFC1918 (the ALB lives in the
    # VPC) and the Docker bridge for local runs.
    location = /up {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        try_files $uri /index.php?$query_string;
    }

    # Repo-shipped static assets (/fonts, /img art, favicons). Un-hashed paths,
    # so a week rather than /build's immutable year. `^~ /build/` and
    # `^~ /storage/` above skip regex matching, so this never overrides them.
    location ~* \.(otf|ttf|woff2?|png|jpe?g|webp|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The front controller is the ONLY executable PHP in the document root.
    # `=` is an exact match and outranks the regex block below it.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Anything else ending in .php — including anything that reached the upload
    # tree — is content, not code. Return 404 rather than serving the source.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles (.env, .git) live above the docroot already; belt-and-braces for
    # anything that lands under public/ by accident.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
