; Three long-lived processes in one container: nginx (public :80), PHP-FPM
; (127.0.0.1:9000) and the Inertia SSR daemon (127.0.0.1:13714).
;
; SSR used to be supervised by a shell `while true` loop inside the Docker CMD.
; Supervisor replaces it: it restarts a crashed daemon the same way, but its
; state is visible to `supervisorctl status`, so a dead SSR daemon is
; diagnosable instead of silently degrading every page to client-render.
;
; Copied to /etc/supervisor/conf.d/app.conf by the Dockerfile.

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ssr]
command=php artisan inertia:start-ssr
directory=/var/www/html
autostart=true
autorestart=true
; Inertia's SSR daemon takes a moment to load the bundle; don't count a start
; as successful until it has stayed up, or a boot-time crash loops silently.
startsecs=5
startretries=5
priority=30
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
