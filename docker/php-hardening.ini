; Runtime hardening for PHP itself. Copied into /usr/local/etc/php/conf.d/
; alongside uploads.ini and opcache.ini.

; Stop advertising the exact PHP build in the X-Powered-By response header —
; it hands an attacker the precise version to look up CVEs against. The site
; was serving `X-Powered-By: PHP/8.3.32` publicly. nginx also strips the header
; via fastcgi_hide_header; this prevents PHP emitting it in the first place.
expose_php = Off

; Errors belong in the log, never in a response body. Laravel's own debug page
; (APP_DEBUG=true) is rendered by its exception handler and is unaffected by
; these — so the local dev experience does not change, but a fatal that escapes
; Laravel can no longer leak paths or fragments of source to a visitor.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Laravel manages its own session cookie, but harden the native handler too in
; case any code path falls back to it.
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
